<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<title>FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f0f; --bg2:#161616; --bg3:#1e1e1e; --bg4:#252525;
  --border:#2a2a2a; --border2:#333; --border3:#3d3d3d;
  --text:#f0ede8; --text2:#9a9690; --text3:#5a5855;
  --accent:#c8f060; --push:#ff6b35; --pull:#4ecdc4; --legs:#a78bfa;
  --rest:#4b5563; --warn:#fbbf24; --red:#f87171; --green:#4ade80;
  --radius:16px; --radius-sm:10px;
  --fh:'Syne',sans-serif; --fm:'DM Mono',monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--fm);}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

/* HEADER */
#hdr{padding:calc(var(--st) + 12px) 18px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
#hdr h1{font-family:var(--fh);font-size:21px;font-weight:800;letter-spacing:-0.5px;}
#hdr h1 span{color:var(--accent);}
.hdr-right{text-align:right;}
.hdr-date{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;}
.hdr-week{font-family:var(--fh);font-size:15px;font-weight:700;}

/* CONTENT */
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#content::-webkit-scrollbar{display:none;}

/* NAV */
#nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:var(--sb);flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border:none;background:none;color:var(--text3);font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:0.07em;cursor:pointer;transition:color 0.2s;}
.nb svg{width:19px;height:19px;stroke-width:1.5;}
.nb.active{color:var(--accent);}

/* SCREENS */
.screen{display:none;padding:14px;padding-bottom:80px;}
.screen.active{display:block;}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.card-sm{padding:11px;}
.clabel{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:7px;}
.stitle{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin:14px 0 9px;}

/* TODAY HERO */
.hero{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:10px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:var(--sc,var(--accent));opacity:0.07;}
.hero-day{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:5px;}
.hero-name{font-family:var(--fh);font-size:26px;font-weight:800;line-height:1.1;margin-bottom:3px;}
.hero-muscles{font-size:12px;color:var(--text2);}

/* EXERCISE ROW */
.exrow{display:flex;align-items:center;gap:10px;padding:11px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:7px;transition:background 0.15s;}
.exrow:active{background:var(--bg4);}
.exnum{font-size:10px;color:var(--text3);width:16px;flex-shrink:0;}
.exinfo{flex:1;cursor:pointer;}
.exname{font-size:13px;font-weight:500;margin-bottom:2px;}
.exmeta{font-size:10px;color:var(--text3);}
.excheck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;cursor:pointer;}
.excheck.done{background:var(--accent);border-color:var(--accent);}
.excheck.done svg{stroke:var(--bg);}
.exdel{width:26px;height:26px;border-radius:50%;background:rgba(248,113,113,0.1);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--red);font-size:16px;transition:all 0.2s;}

/* ADD ROW BUTTON */
.add-row-btn{display:flex;align-items:center;gap:8px;padding:10px 11px;background:transparent;border:1px dashed var(--border3);border-radius:var(--radius-sm);width:100%;cursor:pointer;color:var(--text3);font-family:var(--fm);font-size:12px;transition:all 0.2s;margin-top:4px;}
.add-row-btn:active{background:var(--bg3);}
.add-row-btn svg{width:16px;height:16px;stroke-width:2;flex-shrink:0;}

/* WEEK GRID */
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
.wday{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);transition:all 0.15s;}
.wday.today{border-color:var(--accent);}
.wday.sel{background:var(--accent);border-color:var(--accent);}
.wday.sel .wdn,.wday.sel .wdt{color:var(--bg);}
.wday.restday{background:var(--bg3);}
.wdn{font-size:8px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);}
.wdt{font-size:7px;font-weight:600;text-transform:uppercase;}
.wdot{width:5px;height:5px;border-radius:50%;margin-top:1px;}

/* NUTRITION */
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px;}
.mc{background:var(--bg3);border-radius:var(--radius-sm);padding:11px 8px;text-align:center;}
.mcval{font-family:var(--fh);font-size:19px;font-weight:700;}
.mclbl{font-size:8px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-top:2px;}
.meal-block{margin-bottom:10px;}
.meal-th{display:flex;align-items:center;justify-content:space-between;padding:7px 0;}
.meal-tlbl{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);}
.meal-kcal{font-size:10px;color:var(--accent);}
.meal-items-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.mitem{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);}
.mitem:last-child{border-bottom:none;}
.miname{font-size:12px;}
.miqty{font-size:10px;color:var(--text3);}
.midel{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}

/* SUPPS */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.scard{background:var(--bg3);border-radius:var(--radius-sm);padding:11px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all 0.2s;border:1px solid transparent;}
.scard.taken{background:rgba(200,240,96,0.08);border-color:rgba(200,240,96,0.25);}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sinfo{flex:1;}
.sname{font-size:11px;font-weight:500;}
.swhen{font-size:9px;color:var(--text3);margin-top:1px;}
.schk{font-size:14px;opacity:0;transition:opacity 0.2s;}
.scard.taken .schk{opacity:1;}
.sdel-s{background:none;border:none;color:var(--text3);font-size:15px;cursor:pointer;padding:0;line-height:1;}

/* MONEY */
.budget-hero{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:10px;text-align:center;}
.btotal{font-family:var(--fh);font-size:34px;font-weight:800;margin-bottom:3px;}
.bsub{font-size:11px;color:var(--text3);}
.bbar-wrap{margin:14px 0 7px;background:var(--bg3);border-radius:6px;height:7px;overflow:hidden;}
.bbar{height:100%;border-radius:6px;background:var(--accent);transition:width 0.5s;}
.spend-row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px;}
.sr-l{display:flex;align-items:center;gap:9px;}
.sr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sr-lbl{font-size:12px;}
.sr-cat{font-size:9px;color:var(--text3);margin-top:1px;}
.sr-amt{font-family:var(--fh);font-size:15px;font-weight:700;}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(var(--sb) + 68px);width:50px;height:50px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(200,240,96,0.28);transition:transform 0.15s;z-index:10;}
.fab:active{transform:scale(0.9);}
.fab svg{stroke:var(--bg);}

/* PROGRESS / REPORT */
.pstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.pstat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;}
.pstat-val{font-family:var(--fh);font-size:22px;font-weight:800;}
.pstat-lbl{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-top:3px;}
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.cbars{display:flex;align-items:flex-end;gap:5px;height:72px;margin-top:10px;}
.cbar-w{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;}
.cbar{width:100%;border-radius:3px 3px 0 0;background:var(--bg4);min-height:4px;}
.cbar.done{background:var(--accent);}
.cbar.partial{background:var(--warn);}
.clbl2{font-size:8px;color:var(--text3);text-transform:uppercase;}
.log-entry{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ldate{font-size:9px;color:var(--text3);margin-top:2px;}
.lsess{font-size:12px;font-weight:500;}

/* WEEKLY REPORT */
.report-week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.rnav-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text2);font-family:var(--fm);font-size:12px;cursor:pointer;}
.rnav-btn:active{background:var(--bg4);}
.rnav-label{font-family:var(--fh);font-size:14px;font-weight:700;}
.report-day-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;}
.rday-header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;}
.rday-left{display:flex;align-items:center;gap:10px;}
.rday-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.rday-name{font-size:13px;font-weight:500;}
.rday-type{font-size:10px;color:var(--text3);margin-top:1px;}
.rday-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.rday-body{padding:0 13px 13px;display:none;}
.rday-body.open{display:block;}
.rday-ex{padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;}
.rday-ex:last-child{border-bottom:none;}
.rday-ex-done{color:var(--accent);}
.rday-ex-skip{color:var(--text3);}
.report-summary{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.rs-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
.rs-row:last-child{border-bottom:none;}
.rs-val{font-weight:500;color:var(--accent);}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.mo.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:18px;padding-bottom:calc(18px + var(--sb));width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.mhandle{width:34px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.mtitle{font-family:var(--fh);font-size:17px;font-weight:700;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:var(--fm);font-size:13px;outline:none;appearance:none;-webkit-appearance:none;resize:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field select option{background:var(--bg3);}
.mactions{display:flex;gap:9px;margin-top:18px;}
.btn{flex:1;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--border2);font-family:var(--fm);font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn-p{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500;}
.btn-s{background:none;color:var(--text2);}
.btn-d{background:rgba(248,113,113,0.12);color:var(--red);border-color:rgba(248,113,113,0.3);}
.btn:active{transform:scale(0.97);}

/* PILLS */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pill{padding:4px 11px;border-radius:20px;font-size:10px;border:1px solid var(--border2);cursor:pointer;transition:all 0.15s;}
.pill.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}

/* MISC */
.note{font-size:11px;color:var(--text3);padding:9px 12px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:10px;line-height:1.6;}
.empty{text-align:center;padding:28px 14px;color:var(--text3);font-size:12px;}
.edit-row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.edit-row:last-child{border-bottom:none;}
.edit-lbl{flex:1;font-size:12px;}
.edit-inp{width:78px;padding:5px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--fm);font-size:12px;text-align:right;outline:none;}
.edit-inp:focus{border-color:var(--accent);}
.section-edit-btn{font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px;font-family:var(--fm);}
.section-edit-btn.editing{color:var(--accent);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card,.exrow,.mitem,.spend-row,.log-entry{animation:fadeUp 0.22s ease both;}
</style>
</head>
<body>
<div id="app">

<div id="hdr">
  <div><h1>Fit<span>Track</span></h1><div class="hdr-date" id="hdr-date"></div></div>
  <div class="hdr-right"><div style="font-size:10px;color:var(--text3)">Week</div><div class="hdr-week" id="hdr-week">W1</div></div>
</div>

<div id="content">

  <!-- TODAY -->
  <div class="screen active" id="screen-today">
    <div class="hero" id="today-hero">
      <div class="hero-day" id="today-dayname"></div>
      <div class="hero-name" id="today-sname"></div>
      <div class="hero-muscles" id="today-muscles"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="stitle" style="margin-top:0;">Exercises</div>
      <button class="section-edit-btn" id="today-edit-btn" onclick="toggleTodayEdit()">Edit</button>
    </div>
    <div id="today-exercises"></div>
  </div>

  <!-- WEEK -->
  <div class="screen" id="screen-week">
    <div class="wgrid" id="week-grid"></div>
    <div id="session-panel"></div>
  </div>

  <!-- NUTRITION -->
  <div class="screen" id="screen-nutrition">
    <div class="stitle" style="margin-top:0;">Daily Targets</div>
    <div class="mrow" id="macro-row"></div>
    <div class="pills" id="nutr-pills"></div>
    <div class="note" id="nutr-note"></div>
    <div id="meals-section"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="stitle">Supplements</div>
      <button class="section-edit-btn" id="supp-edit-btn" onclick="toggleSuppEdit()">Edit</button>
    </div>
    <div class="sgrid" id="supp-grid"></div>
    <div id="supp-add-area" style="display:none;margin-top:8px;">
      <button class="add-row-btn" onclick="openAddSupp()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add supplement</button>
    </div>
  </div>

  <!-- MONEY -->
  <div class="screen" id="screen-money">
    <div class="budget-hero">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:3px;">Weekly spend</div>
      <div class="btotal" id="b-total"></div>
      <div class="bsub" id="b-sub"></div>
      <div class="bbar-wrap"><div class="bbar" id="b-bar"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);">
        <span id="b-spent-lbl"></span><span id="b-budget-lbl"></span>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
      <div class="stitle" style="margin:0;">Expenses</div>
      <div style="font-size:10px;color:var(--text3);" id="month-lbl"></div>
    </div>
    <div id="expenses-list"></div>
    <div style="height:70px;"></div>
  </div>

  <!-- PROGRESS -->
  <div class="screen" id="screen-progress">
    <div class="pills" id="prog-pills" style="margin-top:2px;"></div>
    <div id="prog-content"></div>
  </div>

</div>

<!-- NAV -->
<nav id="nav">
  <button class="nb active" onclick="goTo('today')" id="nav-today">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-linecap="round"/></svg>Today
  </button>
  <button class="nb" onclick="goTo('week')" id="nav-week">
    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="3" stroke="currentColor"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-linecap="round"/></svg>Week
  </button>
  <button class="nb" onclick="goTo('nutrition')" id="nav-nutrition">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3C8 3 5 7 5 11c0 5 7 10 7 10s7-5 7-10c0-4-3-8-7-8z" stroke="currentColor"/></svg>Nutrition
  </button>
  <button class="nb" onclick="goTo('money')" id="nav-money">
    <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="14" rx="3" stroke="currentColor"/><path d="M2 10h20M6 14h4" stroke="currentColor" stroke-linecap="round"/></svg>Money
  </button>
  <button class="nb" onclick="goTo('progress')" id="nav-progress">
    <svg viewBox="0 0 24 24" fill="none"><polyline points="3 17 9 11 13 15 21 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>Progress
  </button>
</nav>
</div>

<!-- MODALS -->
<!-- Add Exercise -->
<div class="mo" id="mo-addex" onclick="closeMo(event,'mo-addex')">
<div class="modal">
  <div class="mhandle"></div>
  <div class="mtitle">Add exercise</div>
  <div class="field"><label>Exercise name</label><input id="aex-name" type="text" placeholder="e.g. Cable Crossover"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="field"><label>Sets</label><input id="aex-sets" type="number" inputmode="numeric" placeholder="3"></div>
    <div class="field"><label>Reps</label><input id="aex-reps" type="text" placeholder="10–12"></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div class="field"><label>Rest</label><input id="aex-rest" type="text" placeholder="60s"></div>
    <div class="field"><label>Block (Fri only)</label>
      <select id="aex-block"><option value="">—</option><option value="Push B">Push B</option><option value="Pull B">Pull B</option></select>
    </div>
  </div>
  <div class="field"><label>Notes</label><input id="aex-notes" type="text" placeholder="e.g. Keep elbows soft"></div>
  <div class="mactions">
    <button class="btn btn-s" onclick="closeMoById('mo-addex')">Cancel</button>
    <button class="btn btn-p" onclick="saveAddExercise()">Add exercise</button>
  </div>
</div>
</div>

<!-- Edit Exercise -->
<div class="mo" id="mo-editex" onclick="closeMo(event,'mo-editex')">
<div class="modal">

<script>

const DEFAULT_MEALS_W=[
  {time:'Breakfast 8:00 AM',kcal:520,items:[{name:'Whole eggs',qty:'3 eggs'},{name:'Egg whites',qty:'3 whites'},{name:'Rolled oats',qty:'70g dry'},{name:'Banana',qty:'1 medium'},{name:'Black coffee',qty:'No sugar'}]},

];

  {time:'Breakfast 8:30 AM',kcal:390,items:[{name:'Whole eggs + 2 whites',qty:'3+2 eggs'},{name:'Oats (smaller)',qty:'50g dry'},{name:'Black coffee',qty:'No sugar'}]},
  {time:'Lunch 1:30 PM',kcal:530,items:[{name:'Eggs',qty:'3 whole'},{name:'Rice (reduced)',qty:'100g cooked'},{name:'Dal',qty:'1 katori'},{name:'Sabzi + salad',qty:'1 bowl each'}]},
  {time:'Evening snack 5 PM',kcal:220,items:[{name:'Greek yogurt',qty:'200g'},{name:'Nuts (smaller)',qty:'10g'}]},
  {time:'Dinner 8 PM',kcal:380,items:[{name:'Paneer (reduced)',qty:'120g'},{name:'1 roti',qty:'1 chapati'},{name:'Vegetable sabzi',qty:'1 bowl'}]},
];
const DEFAULT_SUPPS=[
  {name:'Multivitamin',when:'Post-workout',color:'#a78bfa',id:'multi'},
  {name:'Omega-3 (1g)',when:'Breakfast',color:'#4ecdc4',id:'omega1'},
  {name:'Omega-3 (1g)',when:'Dinner',color:'#4ecdc4',id:'omega2'},
  {name:'Zinc',when:'Dinner',color:'#fbbf24',id:'zinc'},
  {name:'Whey protein',when:'Post-workout',color:'#ff6b35',id:'whey'},
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let S={
  completedEx:{}, suppsTaken:{}, expenses:[], workoutLog:[],
  weekBudget:2000, customEx:{},
  workouts: JSON.parse(JSON.stringify(DEFAULT_WORKOUTS)),
  mealsW: JSON.parse(JSON.stringify(DEFAULT_MEALS_W)),
  mealsR: JSON.parse(JSON.stringify(DEFAULT_MEALS_R)),
  supps: JSON.parse(JSON.stringify(DEFAULT_SUPPS)),
};

function load(){try{const s=localStorage.getItem('ft2');if(s){const p=JSON.parse(s);S={...S,...p};}}catch(e){}}
function save(){try{localStorage.setItem('ft2',JSON.stringify(S));}catch(e){}}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const now=()=>new Date();
const tdKey=()=>now().toISOString().split('T')[0];
const tdDow=()=>now().getDay();
const isRest=d=>d===0||d===4;
function wkNum(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w)/86400000-3+(w.getDay()+6)%7)/7);}
function getExList(dow){
  if(dow===5){
    return [...(S.workouts['Push B']||[]).map(e=>({...e,_block:'Push B'})),...(S.workouts['Pull B']||[]).map(e=>({...e,_block:'Pull B'}))];
  }
  const map={1:'Push A',2:'Pull A',3:'Legs A',6:'Legs B'};
  return S.workouts[map[dow]]||[];
}
function getWorkoutKey(dow){const map={1:'Push A',2:'Pull A',3:'Legs A',6:'Legs B'};return map[dow]||null;}
function fmtDate(s){return new Date(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function uid(){return Math.random().toString(36).substr(2,8);}
function colorFor(dow){const s=SCHED[dow];if(!s)return'var(--accent)';const m={'push':'var(--push)','pull':'var(--pull)','legs':'var(--legs)','rest':'var(--rest)','push+pull':'var(--warn)'};return m[s.type]||'var(--accent)';}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
let curScreen='today';
function goTo(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  document.getElementById('nav-'+s).classList.add('active');
  document.getElementById('content').scrollTop=0;
  curScreen=s;
  const fab=document.getElementById('fab');
  if(fab)fab.style.display=s==='money'?'flex':'none';
  if(s==='nutrition')renderNutrition();
  if(s==='week')renderWeek();
  if(s==='progress')renderProgress();
  if(s==='money')renderMoney();
}

// ═══════════════════════════════════════════
// TODAY
// ═══════════════════════════════════════════
let todayEditing=false;
function toggleTodayEdit(){
  todayEditing=!todayEditing;
  document.getElementById('today-edit-btn').textContent=todayEditing?'Done':'Edit';
  document.getElementById('today-edit-btn').classList.toggle('editing',todayEditing);
  renderToday();
}

function renderToday(){
  const dow=tdDow();const sess=SCHED[dow];const key=tdKey();
  const hero=document.getElementById('today-hero');
  hero.style.setProperty('--sc',sess.color);
  document.getElementById('today-dayname').textContent=FDAYS[dow];
  document.getElementById('today-sname').textContent=sess.emoji+' '+sess.name;
  document.getElementById('today-muscles').textContent=sess.muscles;
  const con=document.getElementById('today-exercises');
  con.innerHTML='';

  if(isRest(dow)){
    todayEditing=false;
    con.innerHTML=`<div class="card" style="text-align:center;padding:28px 14px;"><div style="font-size:30px;margin-bottom:7px;">${sess.emoji}</div><div style="font-family:var(--fh);font-size:15px;font-weight:700;margin-bottom:3px;">Rest & recover</div><div style="font-size:11px;color:var(--text3);">${sess.muscles}</div>${dow===0?'<div style="margin-top:10px;font-size:10px;color:var(--accent);">Meal prep day</div>':''}</div>`;
    return;
  }

  const exList=getExList(dow);
  let exIdx=0;let lastBlock=null;
  exList.forEach((ex,i)=>{
    if(ex._block&&ex._block!==lastBlock){
      lastBlock=ex._block;
      const h=document.createElement('div');
      h.className='stitle';h.style.cssText='font-size:10px;margin:10px 0 7px;';
      h.textContent='── '+ex._block+' block ──';con.appendChild(h);
    }
    exIdx++;
    const exKey=key+'_'+ex.name;
    const done=S.completedEx[exKey];
    const cust=S.customEx[exKey];
    const row=document.createElement('div');
    row.className='exrow';
    row.style.animationDelay=(exIdx*0.04)+'s';

    const metaLine=cust?.weight?`${cust.weight}kg × ${cust.reps||ex.reps} reps · ${cust.sets||ex.sets} sets`:`${ex.sets} sets · ${ex.reps} · rest ${ex.rest}`;
    const noteShown=cust?.note||ex.notes;

    row.innerHTML=`
      <div class="exnum">${String(exIdx).padStart(2,'0')}</div>
      <div class="exinfo">
        <div class="exname">${ex.name}</div>
        <div class="exmeta">${metaLine}</div>
        ${noteShown?`<div class="exmeta" style="margin-top:1px;color:var(--text3)">${noteShown}</div>`:''}
      </div>
      ${todayEditing?`<button class="exdel" onclick="deleteTodayEx(${i})">×</button>`:`<div class="excheck ${done?'done':''}" onclick="toggleEx('${exKey}',this)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`}
    `;
    if(!todayEditing)row.querySelector('.exinfo').onclick=()=>openEditEx(ex,exKey,dow);
    con.appendChild(row);
  });

  if(todayEditing){
    const addBtn=document.createElement('button');
    addBtn.className='add-row-btn';
    addBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add exercise`;
    addBtn.onclick=()=>openAddEx(dow);
    con.appendChild(addBtn);
  }
  checkComplete(key,dow,exList.filter(e=>!e._block||true));
}

function toggleEx(key,el){
  S.completedEx[key]=!S.completedEx[key];
  el.classList.toggle('done',S.completedEx[key]);save();
}

function checkComplete(key,dow,exList){
  if(!exList.length)return;
  const allDone=exList.every(e=>S.completedEx[key+'_'+e.name]);
  const lk='log_'+key;
  if(allDone&&!S.workoutLog.find(l=>l.key===lk)){
    const sess=SCHED[dow];
    S.workoutLog.unshift({key:lk,date:key,session:sess.name,type:sess.type,dow});save();
  }
}

function deleteTodayEx(idx){
  const dow=tdDow();
  if(dow===5){
    const pushB=S.workouts['Push B']||[];const pullB=S.workouts['Pull B']||[];
    const combined=[...pushB.map(e=>({...e,_src:'Push B'})),...pullB.map(e=>({...e,_src:'Pull B'}))];
    if(idx<combined.length){
      const ex=combined[idx];
      const wk=ex._src;
      const realIdx=wk==='Push B'?idx:idx-pushB.length;
      S.workouts[wk].splice(realIdx,1);
    }
  }else{
    const wk=getWorkoutKey(dow);
    if(wk&&S.workouts[wk])S.workouts[wk].splice(idx,1);
  }
  save();renderToday();
}

// Edit exercise modal
let editExTarget=null;
function openEditEx(ex,exKey,dow){
  editExTarget={ex,exKey,dow};
  document.getElementById('editex-title').textContent=ex.name;
  const cust=S.customEx[exKey]||{};
  document.getElementById('ew-weight').value=cust.weight||'';
  document.getElementById('ew-reps').value=cust.reps||'';
  document.getElementById('ew-sets').value=cust.sets||ex.sets||'';
  document.getElementById('ew-name').value=ex.name||'';
  document.getElementById('ew-tsets').value=ex.sets||'';
  document.getElementById('ew-treps').value=ex.reps||'';
  document.getElementById('ew-trest').value=ex.rest||'';
  document.getElementById('ew-note').value=cust.note||'';
  document.getElementById('ew-target-note').textContent='Target: '+ex.sets+' sets · '+ex.reps+' reps · rest '+ex.rest;
  document.getElementById('mo-editex').classList.add('open');
}
function saveEditExercise(){
  if(!editExTarget)return;
  const {ex,exKey,dow}=editExTarget;
  S.customEx[exKey]={weight:document.getElementById('ew-weight').value,reps:document.getElementById('ew-reps').value,sets:document.getElementById('ew-sets').value,note:document.getElementById('ew-note').value,saved:new Date().toISOString()};
  // Update exercise definition
  const newName=document.getElementById('ew-name').value.trim();
  const tsets=parseInt(document.getElementById('ew-tsets').value)||ex.sets;
  const treps=document.getElementById('ew-treps').value||ex.reps;
  const trest=document.getElementById('ew-trest').value||ex.rest;
  const updateEx=(list)=>list.map(e=>e.name===ex.name?{...e,name:newName||e.name,sets:tsets,reps:treps,rest:trest}:e);
  if(dow===5){S.workouts['Push B']=updateEx(S.workouts['Push B']||[]);S.workouts['Pull B']=updateEx(S.workouts['Pull B']||[]);}
  else{const wk=getWorkoutKey(dow);if(wk)S.workouts[wk]=updateEx(S.workouts[wk]||[]);}
  save();closeMoById('mo-editex');renderToday();
}
function deleteEditExercise(){
  if(!editExTarget)return;
  const {ex,dow}=editExTarget;
  if(dow===5){S.workouts['Push B']=(S.workouts['Push B']||[]).filter(e=>e.name!==ex.name);S.workouts['Pull B']=(S.workouts['Pull B']||[]).filter(e=>e.name!==ex.name);}
  else{const wk=getWorkoutKey(dow);if(wk)S.workouts[wk]=(S.workouts[wk]||[]).filter(e=>e.name!==ex.name);}
  save();closeMoById('mo-editex');renderToday();
}

// Add exercise modal
let addExDow=null;
function openAddEx(dow){addExDow=dow;['aex-name','aex-sets','aex-reps','aex-rest','aex-notes'].forEach(id=>{document.getElementById(id).value='';});document.getElementById('mo-addex').classList.add('open');}
function saveAddExercise(){
  const name=document.getElementById('aex-name').value.trim();if(!name)return;
  const ex={name,sets:parseInt(document.getElementById('aex-sets').value)||3,reps:document.getElementById('aex-reps').value||'10–12',rest:document.getElementById('aex-rest').value||'60s',notes:document.getElementById('aex-notes').value};
  const block=document.getElementById('aex-block').value;
  if(addExDow===5){const wk=block||'Push B';if(!S.workouts[wk])S.workouts[wk]=[];S.workouts[wk].push(ex);}
  else{const wk=getWorkoutKey(addExDow);if(wk){if(!S.workouts[wk])S.workouts[wk]=[];S.workouts[wk].push(ex);}}
  save();closeMoById('mo-addex');renderToday();
}

let selDay=tdDow();
function renderWeek(){
  const g=document.getElementById('week-grid');g.innerHTML='';
  const td=tdDow();
  DAYS.forEach((d,i)=>{
    const sess=SCHED[i];const div=document.createElement('div');
    div.className='wday'+(i===td?' today':'')+(i===selDay?' sel':'')+(isRest(i)?' restday':'');
    const tc=i===selDay?'var(--bg)':sess.color;
    div.innerHTML=`<div class="wdn">${d}</div><div class="wdt" style="color:${tc}">${isRest(i)?'REST':sess.type.replace('+','&')}</div><div class="wdot" style="background:${sess.color}"></div>`;
    div.onclick=()=>{selDay=i;renderWeek();};
    g.appendChild(div);
  });
  renderSessionPanel(selDay);
}
function renderSessionPanel(dow){
  const p=document.getElementById('session-panel');p.innerHTML='';
  const sess=SCHED[dow];
  const exList=getExList(dow);
  const card=document.createElement('div');card.className='card';card.style.padding='0';card.style.overflow='hidden';
  let bodyHTML='';
  if(isRest(dow)){bodyHTML=`<div class="empty" style="padding:20px;">${dow===0?'Full rest + meal prep day':'Active recovery — walk + stretch'}</div>`;}
  else{
    let lastBlock=null;let exIdx=0;
    bodyHTML=exList.map(e=>{
      exIdx++;let bh='';
      if(e._block&&e._block!==lastBlock){lastBlock=e._block;bh=`<div style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--warn);padding:8px 13px 4px;border-top:1px solid var(--border);">${e._block} block</div>`;}
      return `${bh}<div class="mitem" style="padding:9px 13px;"><div><div class="miname">${e.name}</div><div style="font-size:9px;color:var(--text3);margin-top:1px;">${e.notes||''}</div></div><div style="font-size:10px;color:var(--accent);white-space:nowrap;">${e.sets}×${e.reps}</div></div>`;
    }).join('');
  }
  card.innerHTML=`<div style="padding:13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);">
    <div style="width:40px;height:40px;border-radius:10px;background:${sess.color}22;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${sess.emoji}</div>
    <div><div style="font-family:var(--fh);font-size:15px;font-weight:700;">${sess.name}</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">${sess.muscles}</div></div>
  </div>${bodyHTML}`;
  p.appendChild(card);
}

let nutrMode='workout';let suppEditing=false;
let addItemTarget={mealIdx:null,mode:null};let addMealMode=null;

function toggleSuppEdit(){
  suppEditing=!suppEditing;
  document.getElementById('supp-edit-btn').textContent=suppEditing?'Done':'Edit';

function renderNutrition(){

}

function renderMacros(){

    :[{v:'2,150',l:'kcal',c:'var(--accent)'},{v:'150g',l:'protein',c:'var(--push)'},{v:'230g',l:'carbs',c:'var(--pull)'},{v:'60g',l:'fat',c:'var(--warn)'}];

function renderNutrPills(){
  document.getElementById('nutr-pills').innerHTML=
    `<div class="pill ${nutrMode==='workout'?'active':''}" onclick="setNutrMode('workout')">Workout day</div>

function renderNutrNote(){

function setNutrMode(m){nutrMode=m;renderMacros();renderNutrPills();renderNutrNote();renderMeals();}

function renderMeals(){
  const meals=nutrMode==='rest'?S.mealsR:S.mealsW;
  const con=document.getElementById('meals-section');
  con.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;"><div class="stitle">Meal Plan</div><button class="section-edit-btn" id="meal-edit-btn" onclick="toggleMealEdit()">Edit</button></div>`;
  let mealEditing=window._mealEditing||false;

  meals.forEach((meal,mi)=>{
    const block=document.createElement('div');block.className='meal-block';
    block.innerHTML=`<div class="meal-th">
      <div class="meal-tlbl">${meal.time}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="meal-kcal">~${meal.kcal} kcal</div>
        ${mealEditing?`<button onclick="deleteMeal(${mi})" style="background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;line-height:1;">×</button>`:''}
      </div>
    </div>
    <div class="meal-items-wrap">
      ${meal.items.map((item,ii)=>`<div class="mitem"><div><div class="miname">${item.name}</div><div class="miqty">${item.qty}</div></div>${mealEditing?`<button class="midel" onclick="deleteMealItem(${mi},${ii})">×</button>`:''}</div>`).join('')}
      ${mealEditing?`<div class="mitem" style="cursor:pointer;" onclick="openAddItem(${mi})"><div class="miname" style="color:var(--text3);">+ Add item</div></div>`:''}
    </div>`;

  });

  if(mealEditing){
    const ab=document.createElement('button');ab.className='add-row-btn';
    ab.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add meal`;
    ab.onclick=()=>openAddMeal();con.appendChild(ab);

window._mealEditing=false;
function toggleMealEdit(){
  window._mealEditing=!window._mealEditing;
  renderMeals();
  const btn=document.getElementById('meal-edit-btn');
  if(btn){btn.textContent=window._mealEditing?'Done':'Edit';btn.classList.toggle('editing',window._mealEditing);}
}

function deleteMeal(mi){
  if(nutrMode==='rest')S.mealsR.splice(mi,1);else S.mealsW.splice(mi,1);save();renderMeals();
}
function deleteMealItem(mi,ii){
  const meals=nutrMode==='rest'?S.mealsR:S.mealsW;meals[mi].items.splice(ii,1);save();renderMeals();
}

function openAddItem(mi){
  addItemTarget={mealIdx:mi,mode:nutrMode};
  document.getElementById('ai-name').value='';document.getElementById('ai-qty').value='';
  const meals=nutrMode==='rest'?S.mealsR:S.mealsW;
  document.getElementById('additem-title').textContent='Add to: '+meals[mi].time;
  document.getElementById('mo-additem').classList.add('open');
}
function saveAddItem(){
  const name=document.getElementById('ai-name').value.trim();const qty=document.getElementById('ai-qty').value.trim();
  if(!name)return;
  const meals=addItemTarget.mode==='rest'?S.mealsR:S.mealsW;
  meals[addItemTarget.mealIdx].items.push({name,qty:qty||''});
  save();closeMoById('mo-additem');renderMeals();
}

function openAddMeal(){
  addMealMode=nutrMode;
  document.getElementById('am-name').value='';document.getElementById('am-kcal').value='';
  document.getElementById('mo-addmeal').classList.add('open');
}
function saveAddMeal(){
  const name=document.getElementById('am-name').value.trim();const kcal=parseInt(document.getElementById('am-kcal').value)||0;
  if(!name)return;
  const meal={time:name,kcal,items:[]};
  if(addMealMode==='rest')S.mealsR.push(meal);else S.mealsW.push(meal);
  save();closeMoById('mo-addmeal');renderMeals();
}

function renderSupps(){
  const key=tdKey();
  document.getElementById('sgrid')||document.getElementById('supp-grid');
  const g=document.getElementById('supp-grid');g.innerHTML='';
  S.supps.forEach((s,i)=>{
    const taken=S.suppsTaken[key+'_'+s.id];
    const div=document.createElement('div');div.className='scard'+(taken?' taken':'');

    div.innerHTML=`<div class="sdot" style="background:${s.color}"></div><div class="sinfo"><div class="sname">${s.name}</div><div class="swhen">${s.when}</div></div>${suppEditing?`<button class="sdel-s" onclick="deleteSupp(${i});event.stopPropagation();">×</button>`:`<div class="schk">✓</div>`}`;

function deleteSupp(i){S.supps.splice(i,1);save();renderSupps();}
function openAddSupp(){document.getElementById('as-name').value='';document.getElementById('as-when').value='';document.getElementById('mo-addsupp').classList.add('open');}
function saveAddSupp(){

}

function renderMoney(){
  const total=S.expenses.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const budget=S.weekBudget||2000;const pct=Math.min(100,Math.round(total/budget*100));
  const rem=budget-total;
  document.getElementById('b-total').textContent='₹'+total.toLocaleString('en-IN');
  document.getElementById('b-total').style.color=total>budget?'var(--red)':'var(--accent)';
  document.getElementById('b-sub').textContent=rem>=0?`₹${rem.toLocaleString('en-IN')} remaining`:`₹${Math.abs(rem).toLocaleString('en-IN')} over budget`;
  document.getElementById('b-bar').style.cssText=`width:${pct}%;background:${total>budget?'var(--red)':'var(--accent)'}`;
  document.getElementById('b-spent-lbl').textContent='Spent ₹'+total.toLocaleString('en-IN');
  document.getElementById('b-budget-lbl').textContent='Budget ₹'+budget.toLocaleString('en-IN');
  document.getElementById('month-lbl').textContent=new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  const list=document.getElementById('expenses-list');list.innerHTML='';

  // Budget input
  list.innerHTML+=`<div class="card card-sm" style="margin-bottom:10px;"><div class="clabel">Weekly budget</div><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:15px;color:var(--text2);">₹</span><input type="number" inputmode="decimal" value="${S.weekBudget}" style="flex:1;padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--fm);font-size:13px;outline:none;" onchange="S.weekBudget=parseFloat(this.value)||2000;save();renderMoney();"></div></div>`;

  if(!S.expenses.length){list.innerHTML+='<div class="empty">No expenses yet. Tap + to add.</div>';return;}

  // Category totals
  const cats={};S.expenses.forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+(parseFloat(e.amount)||0);});
  list.innerHTML+=`<div class="card card-sm" style="margin-bottom:10px;"><div class="clabel">By category</div>${Object.entries(cats).map(([cat,amt])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);"><div style="display:flex;align-items:center;gap:7px;"><div style="width:6px;height:6px;border-radius:50%;background:${CATCOL[cat]||'#9a9690'};"></div><div style="font-size:11px;text-transform:capitalize;">${cat}</div></div><div style="font-family:var(--fh);font-size:12px;font-weight:600;">₹${amt.toLocaleString('en-IN')}</div></div>`).join('')}</div>`;

  list.innerHTML+='<div class="clabel" style="margin-bottom:7px;">All entries</div>';
  [...S.expenses].reverse().forEach((exp,i)=>{
    const row=document.createElement('div');row.className='spend-row';row.style.animationDelay=(i*0.03)+'s';
    row.innerHTML=`<div class="sr-l"><div class="sr-dot" style="background:${CATCOL[exp.cat]||'#9a9690'}"></div><div><div class="sr-lbl">${exp.name}</div><div class="sr-cat">${exp.cat} · ${exp.date}</div></div></div><div style="display:flex;align-items:center;gap:9px;"><div class="sr-amt">₹${parseFloat(exp.amount).toLocaleString('en-IN')}</div><div onclick="delExp(${S.expenses.length-1-i})" style="color:var(--text3);cursor:pointer;font-size:17px;padding:2px 5px;">×</div></div>`;
    list.appendChild(row);
  });
}

function delExp(i){S.expenses.splice(i,1);save();renderMoney();}
function saveExpense(){
  const name=document.getElementById('exp-name').value.trim();const amt=parseFloat(document.getElementById('exp-amt').value);const cat=document.getElementById('exp-cat').value;
  if(!name||!amt)return;
  S.expenses.push({name,amount:amt,cat,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})});
  save();closeMoById('mo-expense');renderMoney();
}

// ═══════════════════════════════════════════
// PROGRESS + WEEKLY REPORT
// ═══════════════════════════════════════════
let progTab='stats';let reportWeekOffset=0;

function renderProgress(){
  document.getElementById('prog-pills').innerHTML=
    `<div class="pill ${progTab==='stats'?'active':''}" onclick="setProgTab('stats')">Stats</div>
     <div class="pill ${progTab==='report'?'active':''}" onclick="setProgTab('report')">Weekly report</div>`;
  if(progTab==='stats')renderStats();
  else renderReport();
}

function setProgTab(t){progTab=t;renderProgress();}

function renderStats(){
  const con=document.getElementById('prog-content');con.innerHTML='';
  const total=S.workoutLog.length;
  const wkAgo=new Date(Date.now()-7*86400000);
  const thisWeek=S.workoutLog.filter(l=>new Date(l.date)>=wkAgo).length;
  const streak=calcStreak();

  con.innerHTML=`<div class="pstat-grid">
    <div class="pstat"><div class="pstat-val" style="color:var(--accent)">${thisWeek}</div><div class="pstat-lbl">This week</div></div>
    <div class="pstat"><div class="pstat-val" style="color:var(--push)">${streak}</div><div class="pstat-lbl">Day streak</div></div>
    <div class="pstat"><div class="pstat-val" style="color:var(--pull)">${total}</div><div class="pstat-lbl">Total sessions</div></div>
    <div class="pstat"><div class="pstat-val" style="color:var(--legs)">${Math.round(total*1.25)}</div><div class="pstat-lbl">Est. sets logged</div></div>
  </div>`;

  // Bar chart
  const chartDiv=document.createElement('div');chartDiv.className='chart-wrap';
  let barsHTML='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key=d.toISOString().split('T')[0];const dow=d.getDay();
    const isW=!isRest(dow);const done=S.workoutLog.some(l=>l.date===key);
    const isToday=i===0;const h=isW?(done?100:20):10;
    barsHTML+=`<div class="cbar-w"><div class="cbar ${done?'done':''}" style="height:${h}%;"></div><div class="clbl2" style="${isToday?'color:var(--accent)':''}">${DAYS[dow]}</div></div>`;
  }
  chartDiv.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;"><div style="font-size:12px;font-weight:500;">Last 7 days</div><div style="font-size:10px;color:var(--accent);">${streak} day streak</div></div><div class="cbars">${barsHTML}</div>`;
  con.appendChild(chartDiv);

  // Log
  const logTitle=document.createElement('div');logTitle.className='stitle';logTitle.textContent='Workout Log';con.appendChild(logTitle);
  if(!S.workoutLog.length){con.innerHTML+='<div class="empty">No workouts logged yet.</div>';return;}
  S.workoutLog.slice(0,20).forEach((l,i)=>{
    const div=document.createElement('div');div.className='log-entry';div.style.animationDelay=(i*0.03)+'s';
    div.innerHTML=`<div class="ldot" style="background:${colorFor(l.dow||new Date(l.date).getDay())}"></div><div><div class="lsess">${l.session}</div><div class="ldate">${fmtDate(l.date)}</div></div>`;
    con.appendChild(div);
  });
}

function calcStreak(){
  let s=0;const n=new Date();
  for(let i=0;i<30;i++){const d=new Date(n);d.setDate(d.getDate()-i);const k=d.toISOString().split('T')[0];const dow=d.getDay();if(isRest(dow))continue;if(S.workoutLog.some(l=>l.date===k))s++;else break;}
  return s;
}

function renderReport(){
  const con=document.getElementById('prog-content');con.innerHTML='';

  // Week nav
  const weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay()-1+(reportWeekOffset*7)+1);// Monday
  if(weekStart.getDay()!==1)weekStart.setDate(weekStart.getDate()-(weekStart.getDay()-1+7)%7);
  weekStart.setDate(weekStart.getDate()+reportWeekOffset*7);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);

  const wlabel=weekStart.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' – '+weekEnd.toLocaleDateString('en-IN',{day:'numeric',month:'short'});

  const nav=document.createElement('div');nav.className='report-week-nav';
  nav.innerHTML=`<button class="rnav-btn" onclick="reportWeekOffset--;renderProgress()">← Prev</button><div class="rnav-label">${wlabel}</div><button class="rnav-btn" onclick="if(reportWeekOffset<0){reportWeekOffset++;renderProgress()}" style="opacity:${reportWeekOffset>=0?0.3:1}">Next →</button>`;
  con.appendChild(nav);

  // Build 7 days Mon–Sun
  let workoutsCompleted=0;let workoutsPlanned=0;let suppDaysLogged=0;
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(d.getDate()+i);
    const key=d.toISOString().split('T')[0];const dow=d.getDay();
    const sess=SCHED[dow];const rest=isRest(dow);
    const logged=S.workoutLog.find(l=>l.date===key);
    const exList=rest?[]:getExList(dow);
    const completedExs=exList.filter(e=>S.completedEx[key+'_'+e.name]);
    const pct=exList.length?Math.round(completedExs.length/exList.length*100):null;
    if(!rest)workoutsPlanned++;
    if(logged)workoutsCompleted++;
    const suppCount=S.supps.filter(s=>S.suppsTaken[key+'_'+s.id]).length;
    if(suppCount>0)suppDaysLogged++;
    days.push({d,key,dow,sess,rest,logged,exList,completedExs,pct,suppCount});
  }

  // Summary card
  const perfPct=workoutsPlanned?Math.round(workoutsCompleted/workoutsPlanned*100):0;
  const summaryColors=['var(--red)','var(--warn)','var(--accent)'];
  const scoreColor=perfPct>=80?summaryColors[2]:perfPct>=50?summaryColors[1]:summaryColors[0];
  const sumCard=document.createElement('div');sumCard.className='report-summary';
  sumCard.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-family:var(--fh);font-size:15px;font-weight:700;">Week summary</div>
      <div style="font-family:var(--fh);font-size:22px;font-weight:800;color:${scoreColor};">${perfPct}%</div>
    </div>
    <div class="rs-row"><span>Workouts completed</span><span class="rs-val">${workoutsCompleted} / ${workoutsPlanned}</span></div>
    <div class="rs-row"><span>Days with supplements</span><span class="rs-val">${suppDaysLogged} / 7</span></div>
    <div class="rs-row"><span>Weekly spend</span><span class="rs-val">₹${S.expenses.reduce((a,e)=>a+(parseFloat(e.amount)||0),0).toLocaleString('en-IN')}</span></div>
    <div class="rs-row"><span>Performance</span><span class="rs-val" style="color:${scoreColor}">${perfPct>=80?'Great week 🔥':perfPct>=50?'Good effort 💪':'Keep pushing 👊'}</span></div>
  `;
  con.appendChild(sumCard);

  // Day-by-day cards
  const dayTitle=document.createElement('div');dayTitle.className='stitle';dayTitle.textContent='Day breakdown';con.appendChild(dayTitle);

  days.forEach(({d,key,dow,sess,rest,logged,exList,completedExs,pct,suppCount})=>{
    const card=document.createElement('div');card.className='report-day-card';
    const isToday=key===tdKey();
    const badgeColor=rest?'var(--rest)':logged?'var(--green)':'var(--red)';
    const badgeBg=rest?'rgba(75,85,99,0.2)':logged?'rgba(74,222,128,0.12)':'rgba(248,113,113,0.12)';
    const badgeText=rest?'Rest':logged?'Done':isToday?'Today':'Missed';
    const dotColor=colorFor(dow);
    card.innerHTML=`
      <div class="rday-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <div class="rday-left">
          <div class="rday-dot" style="background:${dotColor}"></div>
          <div>
            <div class="rday-name">${FDAYS[dow]} · ${d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
            <div class="rday-type">${sess.name}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:7px;">
          ${!rest&&pct!==null?`<div style="font-size:10px;color:var(--text3);">${completedExs.length}/${exList.length}</div>`:''}
          <div class="rday-badge" style="color:${badgeColor};background:${badgeBg};">${badgeText}</div>
        </div>
      </div>
      <div class="rday-body">
        ${rest?`<div style="font-size:11px;color:var(--text3);padding:4px 0;">${sess.muscles}</div>`:''}
        ${!rest?exList.map(e=>{const done=S.completedEx[key+'_'+e.name];const cust=S.customEx[key+'_'+e.name];return `<div class="rday-ex"><div class="${done?'rday-ex-done':'rday-ex-skip'}">${done?'✓ ':''} ${e.name}</div><div style="font-size:10px;color:${done?'var(--accent)':'var(--text3)'};">${cust?.weight?cust.weight+'kg':e.sets+'×'+e.reps}</div></div>`}).join(''):''}
        <div style="display:flex;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">
          <div style="font-size:10px;color:var(--text3);">Supps taken: <span style="color:${suppCount>0?'var(--accent)':'var(--text3)'};">${suppCount}/${S.supps.length}</span></div>
        </div>
      </div>
    `;
    con.appendChild(card);
  });
}

// MODALS
// ═══════════════════════════════════════════
function closeMo(e,id){if(e.target.classList.contains('mo'))closeMoById(id);}
function closeMoById(id){document.getElementById(id).classList.remove('open');}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
load();
// Header
document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('hdr-week').textContent='W'+wkNum();
renderToday();

// FAB
const fab=document.createElement('button');fab.id='fab';fab.className='fab';fab.style.display='none';
fab.onclick=()=>document.getElementById('mo-expense').classList.add('open');
fab.innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
document.body.appendChild(fab);

// Swipe nav
let tx=0;
const SCREENS=['today','week','nutrition','money','progress'];
document.getElementById('content').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('content').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>65){const idx=SCREENS.indexOf(curScreen);if(dx<0&&idx<SCREENS.length-1)goTo(SCREENS[idx+1]);if(dx>0&&idx>0)goTo(SCREENS[idx-1]);}
},{passive:true});
</script>
